name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore GhostScreen.sln
      - name: Format check
        run: dotnet format GhostScreen.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build GhostScreen.sln -c Release --no-restore
      - name: Unit tests
        run: dotnet run --project tests/GhostScreen.Tests -c Release --no-build
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-log
          path: |
            tests/GhostScreen.Tests/bin/Release/**/*.log
          if-no-files-found: ignore

  codeql:
    # Code scanning is not available on private repositories without GitHub
    # Advanced Security; the job fails while private with "Resource not
    # accessible by integration". Run it once the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-2022
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
