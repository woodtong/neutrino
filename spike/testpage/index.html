<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GhostScreen Spike</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 40px; background: #ffffff; color: #111827; }
    h1 { font-size: 28px; margin: 0 0 12px; }
    #status { font-size: 18px; color: #334155; margin: 0 0 24px; }
    button { font-size: 16px; padding: 10px 18px; border-radius: 8px; border: 1px solid #2563eb; background: #2563eb; color: white; }
    #box { margin-top: 28px; width: 320px; height: 120px; display: flex; align-items: center; justify-content: center;
           background: #dbeafe; color: #1e3a8a; font-size: 24px; font-weight: 700; border-radius: 12px; }
  </style>
</head>
<body>
  <h1 id="title">GhostScreen Spike Page</h1>
  <p id="status">idle</p>
  <button id="btn">Click Me</button>
  <div id="box">frame 0</div>
  <script>
    let n = 0;
    setInterval(() => {
      n += 1;
      document.getElementById('box').textContent = 'frame ' + n;
    }, 100);

    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('status').textContent = 'clicked';
      console.log('spike-console');
    });
  </script>
</body>
</html>
